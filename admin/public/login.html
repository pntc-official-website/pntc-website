<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PNTC Admin – Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Montserrat',system-ui,sans-serif;
  background:#0F1520;
  color:#E2E8F0;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  padding:1.5rem;
}

/* Background subtle pattern */
body::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 80% 60% at 20% -10%, rgba(14,37,100,.45) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 110%, rgba(10,25,60,.5) 0%, transparent 60%);
  pointer-events:none;
}

.login-wrap{
  position:relative;
  width:100%;
  max-width:420px;
}

.login-logo{
  display:flex;justify-content:center;margin-bottom:2rem;
}
.login-logo img{
  height:48px;width:auto;
  filter:brightness(0) invert(1);
}

.login-card{
  background:#172033;
  border:1px solid rgba(255,255,255,.07);
  border-radius:12px;
  padding:2.25rem 2rem;
  box-shadow:0 24px 64px rgba(0,0,0,.5);
}

.login-heading{
  font-size:1.35rem;font-weight:800;letter-spacing:-.01em;
  color:#fff;margin-bottom:.35rem;text-align:center;
}
.login-sub{
  font-size:.8rem;color:rgba(255,255,255,.38);text-align:center;
  margin-bottom:2rem;letter-spacing:.04em;
}

.field{margin-bottom:1.1rem;}
.field label{
  display:block;font-size:.72rem;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:.45rem;
}
.field input{
  width:100%;padding:.8rem 1rem;
  background:#0F1520;
  border:1px solid rgba(255,255,255,.1);
  border-radius:6px;
  color:#E2E8F0;font-size:.9rem;font-family:inherit;
  outline:none;transition:border-color .18s;
}
.field input:focus{border-color:#C8960C;}
.field input::placeholder{color:rgba(255,255,255,.2);}

.error-msg{
  font-size:.8rem;color:#f87171;
  background:rgba(248,113,113,.08);
  border:1px solid rgba(248,113,113,.2);
  border-radius:6px;padding:.65rem 1rem;
  margin-bottom:1rem;display:none;
}
.error-msg.show{display:block;}

.login-btn{
  width:100%;padding:.9rem;
  background:#C8960C;
  color:#111;font-family:inherit;font-weight:800;font-size:.88rem;
  letter-spacing:.08em;text-transform:uppercase;
  border:none;border-radius:6px;cursor:pointer;
  transition:background .18s,opacity .18s;
  margin-top:.25rem;
}
.login-btn:hover:not(:disabled){background:#D4A017;}
.login-btn:disabled{opacity:.55;cursor:not-allowed;}

.login-footer{
  text-align:center;margin-top:1.5rem;
  font-size:.72rem;color:rgba(255,255,255,.2);letter-spacing:.04em;
}
</style>
</head>
<body>

<div class="login-wrap">
  <div class="login-logo">
    <img src="/site-files/SHS/PNTC White Horizontal.png" alt="PNTC"
         onerror="this.style.display='none'">
  </div>

  <div class="login-card">
    <div class="login-heading">Admin Console</div>
    <div class="login-sub">PNTC Staff Access Only</div>

    <div class="error-msg" id="err"></div>

    <div class="field">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="you@pntc.edu.ph" autocomplete="email">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="login-btn" id="login-btn" onclick="doLogin()">Sign In</button>
  </div>

  <div class="login-footer">PNTC Colleges, Inc. · Dasmariñas, Cavite</div>
</div>

<script>
// If already logged in, skip straight to dashboard
fetch('/api/auth/check').then(r=>r.json()).then(d=>{ if(d.ok) location.href='/admin/'; });

document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

async function doLogin() {
  const btn   = document.getElementById('login-btn');
  const err   = document.getElementById('err');
  const email = document.getElementById('email').value.trim();
  const pass  = document.getElementById('password').value;

  err.classList.remove('show');
  if (!email || !pass) { err.textContent = 'Please enter your email and password.'; err.classList.add('show'); return; }

  btn.disabled = true;
  btn.textContent = 'Signing in…';

  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pass })
    });
    const d = await r.json();
    if (d.ok) {
      location.href = '/admin/';
    } else {
      err.textContent = d.error || 'Login failed. Check your credentials.';
      err.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  } catch (e) {
    err.textContent = 'Network error — is the server running?';
    err.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
}
</script>
</body>
</html>
